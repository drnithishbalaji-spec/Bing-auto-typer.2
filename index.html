```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bing Automator - Auto Loop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .terminal { background-color: #050505; font-family: 'Courier New', Courier, monospace; }
        .cursor { border-right: 2px solid #3b82f6; animation: blink 0.5s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        .tab-active { background: #3b82f6; color: white; box-shadow: 0 0 20px #3b82f6; border-color: #3b82f6; transform: scale(1.05); }
        .bing-window { width: 100%; height: 500px; border: none; border-radius: 20px; background: white; transition: all 0.5s ease; }
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4">

    <!-- Auth Screen -->
    <div id="authScreen" class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-sm text-center border-t-8 border-blue-600">
        <div class="mb-6 flex justify-center">
            <div class="bg-blue-600 p-4 rounded-full">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            </div>
        </div>
        <h2 class="text-2xl font-black mb-1">AUTH REQUIRED</h2>
        <p class="text-slate-400 text-[10px] mb-8 uppercase tracking-[0.3em] font-bold">PIN: 1045</p>
        <input type="password" id="pinInput" maxlength="4" placeholder="••••" 
            class="w-full text-center text-4xl font-bold tracking-[0.5em] bg-slate-100 p-5 rounded-3xl outline-none border-2 border-transparent focus:border-blue-500 transition-all">
    </div>

    <!-- Main Automation Interface -->
    <div id="mainInterface" class="hidden w-full max-w-6xl space-y-4">
        
        <div class="flex flex-col lg:flex-row gap-6">
            <!-- Left: Terminal Controls -->
            <div class="lg:w-1/3 flex flex-col gap-4">
                <div class="terminal p-6 rounded-[2rem] border border-blue-500/20 flex flex-col justify-between h-full min-h-[450px]">
                    <div class="space-y-6">
                        <div class="flex justify-between items-center">
                            <span class="text-blue-500 text-[10px] font-black tracking-widest flex items-center gap-2">
                                <span class="w-2 h-2 bg-blue-500 rounded-full animate-ping"></span>
                                CONNECTED_TO_BING
                            </span>
                            <span id="cycleCount" class="text-white text-[10px] font-bold bg-blue-900/50 px-2 py-0.5 rounded">SEARCHES: 0</span>
                        </div>
                        
                        <div class="bg-black/50 p-4 rounded-xl border border-white/5">
                            <div class="text-slate-500 text-[9px] font-bold mb-1 uppercase tracking-tighter">Current_Query</div>
                            <div class="text-white text-lg font-bold">
                                <span class="text-blue-500">$</span> <span id="typerText"></span><span class="cursor"></span>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div id="t1" class="text-center border border-slate-800 text-slate-600 py-3 rounded-xl text-[9px] font-black transition-all">TAB_NAV_1</div>
                            <div id="t2" class="text-center border border-slate-800 text-slate-600 py-3 rounded-xl text-[9px] font-black transition-all">TAB_NAV_2</div>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div class="flex justify-between text-[9px] font-bold text-slate-500 uppercase tracking-widest">
                            <span>Next Cycle In</span>
                            <span id="timerText">8s</span>
                        </div>
                        <div class="h-1 bg-slate-900 rounded-full overflow-hidden">
                            <div id="progressFill" class="h-full bg-blue-500 w-0"></div>
                        </div>
                        <button id="toggleBtn" class="w-full bg-red-500/10 text-red-500 border border-red-500/20 py-4 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-red-500 hover:text-white transition-all">
                            Kill Process
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right: Bing View -->
            <div class="lg:w-2/3 bg-white rounded-[2.5rem] overflow-hidden shadow-2xl flex flex-col border border-white">
                <div class="p-4 bg-slate-50 border-b flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <div class="flex space-x-1">
                            <div class="w-2.5 h-2.5 rounded-full bg-slate-200"></div>
                            <div class="w-2.5 h-2.5 rounded-full bg-slate-200"></div>
                            <div class="w-2.5 h-2.5 rounded-full bg-slate-200"></div>
                        </div>
                        <div class="h-6 w-px bg-slate-200 mx-2"></div>
                        <div class="text-[10px] font-mono text-slate-400 italic">bing.com/search_automation_v4</div>
                    </div>
                </div>
                <iframe id="bingFrame" class="bing-window" src="about:blank"></iframe>
            </div>
        </div>
    </div>

    <script>
        const words = ["Quantum", "Encryption", "Architecture", "Atmosphere", "Velocity", "Synthesis", "Database", "Protocol", "Framework", "Metadata", "Interface", "Algorithm", "Network", "Security", "Process"];
        const pinInput = document.getElementById('pinInput');
        const authScreen = document.getElementById('authScreen');
        const mainInterface = document.getElementById('mainInterface');
        const typerText = document.getElementById('typerText');
        const bingFrame = document.getElementById('bingFrame');
        const toggleBtn = document.getElementById('toggleBtn');
        const t1 = document.getElementById('t1');
        const t2 = document.getElementById('t2');
        const cycleCountDisplay = document.getElementById('cycleCount');
        const progressFill = document.getElementById('progressFill');
        const timerText = document.getElementById('timerText');

        let isRunning = false;
        let cycles = 0;

        pinInput.addEventListener('input', (e) => {
            if (e.target.value === '1045') {
                authScreen.classList.add('hidden');
                mainInterface.classList.remove('hidden');
                isRunning = true;
                runAutomation();
            }
        });

        toggleBtn.onclick = () => {
            isRunning = !isRunning;
            toggleBtn.innerText = isRunning ? "Kill Process" : "Restart Process";
            if(isRunning) runAutomation();
        };

        async function runAutomation() {
            if (!isRunning) return;

            // Reset
            t1.classList.remove('tab-active');
            t2.classList.remove('tab-active');
            typerText.innerText = "";
            
            // 1. Automatic Typing (1s Duration)
            const query = words[Math.floor(Math.random() * words.length)] + " " + 
                          words[Math.floor(Math.random() * words.length)] + " " + 
                          Math.floor(Math.random() * 999);
            
            const typingInterval = 1000 / query.length;
            for (let char of query) {
                if(!isRunning) return;
                typerText.innerText += char;
                await new Promise(r => setTimeout(r, typingInterval));
            }

            // 2. Automatic Tab-Tab
            await new Promise(r => setTimeout(r, 200));
            t1.classList.add('tab-active');
            await new Promise(r => setTimeout(r, 200));
            t2.classList.add('tab-active');

            // 3. Automatic Connection to Bing
            bingFrame.src = `https://www.bing.com/search?q=${encodeURIComponent(query)}`;
            cycles++;
            cycleCountDisplay.innerText = `SEARCHES: ${cycles}`;

            // 4. Cool-down & Automatic Restart
            let timeLeft = 10000; // 10 seconds between searches
            while(timeLeft > 0) {
                if(!isRunning) return;
                await new Promise(r => setTimeout(r, 100));
                timeLeft -= 100;
                progressFill.style.width = ((10000 - timeLeft) / 10000 * 100) + "%";
                timerText.innerText = Math.ceil(timeLeft / 1000) + "s";
            }

            runAutomation();
        }
    </script>
</body>
</html>
